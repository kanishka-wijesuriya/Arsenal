name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Arsenal.slnx

      # Arsenal keeps CS8602 and CS8604 out of NoWarn on purpose, so a nullability
      # warning is a real finding. Failing the build on any warning keeps it that way.
      - name: Build
        run: dotnet build Arsenal.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Arsenal.Tests/Arsenal.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish single-file executable
        run: >
          dotnet publish Arsenal.UI/Arsenal.UI.csproj
          -c Release -p:Platform=x64 -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/win-x64

      # Unsigned, and built by CI rather than from the release machine. Useful for
      # testing a pull request, not a release. Releases are built and signed separately.
      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: Arsenal-unsigned-win-x64
          path: artifacts/win-x64/Arsenal.exe
          if-no-files-found: error
